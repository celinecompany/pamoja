<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#08080A"/>
  <!-- Green mark -->
  <rect x="6" y="6" width="52" height="52" rx="11" fill="#16A34A"/>
  <!-- Subtle football pentagon lines -->
  <circle cx="32" cy="32" r="20" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" fill="none"/>
  <line x1="32" y1="12" x2="32" y2="52" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="12" y1="32" x2="52" y2="32" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- TZ -->
  <text x="32" y="42" font-family="'Bebas Neue','Impact',sans-serif" font-size="28" font-weight="400" fill="white" text-anchor="middle" letter-spacing="1">TZ</text>
</svg>
